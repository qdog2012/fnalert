name: Release
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version=$(sed -n 's/^VERSION="${VERSION:-\([^}]*\)}"/\1/p' scripts/build-fnos-fpk.sh)
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          fi
      - name: Build fnOS package
        run: VERSION="${RELEASE_TAG#v}" bash scripts/build-fnos-fpk.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.fpk --verify-tag --title "fnmonitor ${RELEASE_TAG#v}" --notes-file .github/release-notes.md
