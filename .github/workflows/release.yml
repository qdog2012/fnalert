name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build fnOS package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: VERSION="${RELEASE_TAG#v}" bash scripts/build-fnos-fpk.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.fpk --verify-tag --title "fnmonitor ${RELEASE_TAG#v}" --notes-file .github/release-notes.md
